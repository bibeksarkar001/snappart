<text x="30" y="206" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">Questions a camera cannot answer (like slot depth) go to you. Your answer rebuilds the model in about 2 seconds, with no AI call.</text>
