# One-command local run: `docker compose up --build` (see docs/ops.md). api x1 (2 uvicorn processes), worker x SNAPPART_WORKERS, nginx in
# front with TLS. The Meta key comes from .env at run time and never enters the image. Not yet run in this repo (no Docker on the dev machine).
x-app: &app
  build: .
  image: snappart-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    SNAPPART_ENVIRONMENT: ${SNAPPART_ENVIRONMENT:-production}
    SNAPPART_MOCK: ${SNAPPART_MOCK:-0}
    SNAPPART_ALLOW_MOCK_IN_PRODUCTION: ${SNAPPART_ALLOW_MOCK_IN_PRODUCTION:-0}
    SNAPPART_DATA_DIR: /data
    SNAPPART_TRUSTED_PROXIES: '["172.28.0.10"]'
    SNAPPART_CORS_ORIGINS: ${SNAPPART_CORS_ORIGINS:-[]}
  volumes:
    - data:/data
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  networks:
    snappart: {}

services:
  api:
    <<: *app
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 30s               # SIGTERM: the worker hands its build back to the queue
    deploy:
      replicas: ${SNAPPART_WORKERS:-2}
  proxy:
    image: nginx:1.27.3-alpine
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro     # owner: fullchain.pem and privkey.pem (git-ignored)
    restart: unless-stopped
    networks:
      snappart:
        ipv4_address: 172.28.0.10

volumes:
  data: {}

networks:
  snappart:
    ipam:
      config:
        - subnet: 172.28.0.0/24
