# Linux environment for the Docker image: only the backend's direct dependencies, at the versions pinned in environment.yml (which is a
# full macOS export and does not solve on Linux). Keep the two in step when a version changes. Not yet solved on Linux in this repo
# (no Docker on the dev machine); see docs/ops.md.
name: snappart
channels:
  - conda-forge
dependencies:
  - python=3.11.17
  - cadquery=2.8.0
  - ocp=7.9.3.1
  - numpy=1.26.4
  - scipy=1.17.1
  - scikit-image=0.20.0
  - pillow=13.0.0
  - psutil=7.2.2
  - attrs=26.1.0
  - pip
  - pip:
      - fastapi==0.162.0
      - starlette==1.10.0
      - uvicorn==0.54.0
      - uvloop==0.23.0
      - httptools==0.9.0
      - h11==0.16.0
      - pydantic==2.14.1
      - pydantic-core==2.50.1
      - pydantic-settings==2.16.1
      - python-dotenv==1.2.4
      - python-multipart==0.0.32
      - httpx==0.28.1
      - openai==3.39.0
      - meta-sam-parser==0.1.0
      - opencv-python-headless==5.0.0.93
      - jsonschema==4.26.0
      - jsonschema-specifications==2025.9.1
      - referencing==0.37.0
      - rpds-py==2026.9.1
