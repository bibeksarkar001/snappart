# SnapPart reverse proxy: the second layer in front of the API (the API enforces the same limits itself). TLS terminates here.
# Owner decisions: server_name and the certificate paths. Not yet run in this repo (no nginx or Docker on the dev machine); stage 7's
# compose file mounts it and the load test exercises it.
worker_processes auto;
events { worker_connections 4096; }

http {
    server_tokens off;
    access_log off;                                   # no IP logs; the API logs request ids and salted IP hashes only

    # slowloris and connection limits
    client_header_timeout 10s;
    client_body_timeout 20s;                          # matches SNAPPART_UPLOAD_STALL_S
    send_timeout 30s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=create:10m rate=30r/m;

    upstream snappart_api { server api:8000; keepalive 64; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name snappart.example;                 # owner decision
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        limit_conn perip 40;
        client_max_body_size 64k;                     # JSON routes; uploads raise it below

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # replaces any client-sent value; set SNAPPART_TRUSTED_PROXIES to this proxy
        proxy_read_timeout 60s;

        location ~ ^/v1/jobs/[^/]+/videos/[0-9]+/frames/[0-9]+$ {
            client_max_body_size 3m;
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://snappart_api;
        }
        location ~ ^/v1/jobs/[^/]+/voice$ {
            client_max_body_size 33m;
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://snappart_api;
        }
        location ~ ^/v1/jobs/[^/]+/events$ {
            limit_req zone=api burst=20 nodelay;
            proxy_buffering off;                      # SSE
            proxy_read_timeout 1900s;                 # a little over SNAPPART_SSE_MAX_S
            proxy_pass http://snappart_api;
        }
        location = /v1/jobs {
            limit_req zone=create burst=10 nodelay;
            proxy_pass http://snappart_api;
        }
        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://snappart_api;
        }
        limit_req_status 429;
        limit_conn_status 429;
    }
}
